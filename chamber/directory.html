<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Directory | Chamber of Commerce</title>
    <meta name="description" content="Explore the local business directory of our Chamber of Commerce. Discover local partners, gold, silver, and community members.">
    <meta name="author" content="Eze Chibueze Prosper">
    
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">

    <meta property="og:title" content="Chamber of Commerce Business Directory">
    <meta property="og:description" content="Connect with trusted local businesses and organizational members in our community grid and list directory.">
    <meta property="og:image" content="images/logo.png">
    <meta property="og:url" content="https://github.io">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/small.css">
    <link rel="stylesheet" href="css/larger.css" media="screen and (min-width: 48rem)">
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="images/logo.png" alt="Chamber Logo" class="logo">
            <h1>Community Chamber</h1>
        </div>
        <button id="menu-toggle" aria-label="Toggle Menu">&#9776;</button>
        <nav id="nav-menu">
            <ul>
                <li><a href="#" class="active">Home</a></li>
                <li><a href="directory.html">Directory</a></li>
                <li><a href="#">Join</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="directory-controls">
            <h2>Business Directory</h2>
            <div class="view-buttons">
                <button id="grid-view" class="active" aria-label="Grid View">Grid View 🪟</button>
                <button id="list-view" aria-label="List View">List View ☰</button>
            </div>
        </section>

        <article id="directory-container" class="grid">
        </article>
    </main>

    <footer>
        <div class="footer-info">
            <p><strong>Community Chamber of Commerce</strong></p>
            <p>100 Chamber Blvd, City Centre</p>
            <p>Phone: (555) 555-0100 | info@chamber.org</p>
        </div>
        <div class="footer-dev">
            <p>&copy; <span id="current-year"></span> | Eze Chibueze Prosper | WDD 231</p>
            <p>Last Modified: <span id="last-modified"></span></p>
        </div>
    </footer>

    <script src="js/directory.js" defer></script>

</html>
