<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 231 - Course Home Page</title>
    <meta name="description" content="Course home page for WDD 231: Web Frontend Development. Features course work, certificate information, and responsive layout.">
    <meta name="author" content="Your Name">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Style Sheets -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">
    
    <!-- Scripts (Using defer method) -->
    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/date.js" defer></script>
    <script src="scripts/course.js" defer></script>

<body>

    <header>
        <img src="images/logo.svg" alt="Site Logo" width="50" height="50">
        <span>Your Name</span>
        <button id="menu-toggle" aria-label="Toggle Menu">&#9776;</button>
    </header>

    <nav>
        <a href="#" class="active">Home</a>
        <a href="chamber/index.html">Chamber</a>

    <main>
        <h1>Home</h1>
        
        <section id="course-work">
            <h2>Course Work</h2>
            <!-- Course cards/details will go here -->
        </section>

        <section id="certificate-info">
            <h2>Web &amp; Computer Programming Certificate</h2>
            <div class="filters">
                <button id="filter-all">All</button>
                <button id="filter-wdd">WDD</button>
                <button id="filter-cse">CSE</button>

            <p id="total-credits">Total Credits: 0</p>

    <footer>
        <div class="social-links">

            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
        </div>
        <p>&copy; <span id="currentYear"></span> | Your Name | Your State/Country</p>
